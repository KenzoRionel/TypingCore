<!DOCTYPE html>

  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Speed Typing Test - Kata Umum</title>
    <!-- Anti-FOUC: set data-theme SEBELUM CSS lain di-render, supaya halaman
         tidak "flash" tema default lalu berubah ke tema tersimpan. Logika ini
         sengaja diduplikasi (bukan import js/theme.js) karena script inline
         blocking di <head> tidak bisa pakai ES module secara sinkron. Tetap
         konsisten dengan resolveInitialTheme() di js/theme.js: localStorage
         ('typing-theme') > migrasi key lama 'darkMode' > prefers-color-scheme
         > default 'light'. -->
    <script>
      (function () {
        try {
          var STORAGE_KEY = "typing-theme";
          var LEGACY_STORAGE_KEY = "darkMode";
          var theme = localStorage.getItem(STORAGE_KEY);

          if (!theme) {
            var legacy = localStorage.getItem(LEGACY_STORAGE_KEY);
            if (legacy !== null) {
              theme = legacy === "enabled" ? "dark" : "light";
            }
          }

          if (!theme) {
            var prefersDark =
              window.matchMedia &&
              window.matchMedia("(prefers-color-scheme: dark)").matches;
            theme = prefersDark ? "dark" : "light";
          }

          document.documentElement.setAttribute("data-theme", theme);
        } catch (e) {
          document.documentElement.setAttribute("data-theme", "light");
        }
      })();
    </script>

    <link rel="icon" href="img/TypingCoreIcon.svg" type="image/x-icon" />

    />
    <link href="css/bootstrap/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="css/theme.css" />
    <link rel="stylesheet" href="css/text-display.css" />
    <link rel="stylesheet" href="css/speedometer-style.css" />
    <link rel="stylesheet" href="css/statistics-panel.css" />
    <link rel="stylesheet" href="css/time-mode-modal.css" />
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  </head>
  <body>
    <div class="wrapper">
      <main class="main-content">
        <header id="header" class="site-header d-flex align-items-center">
          <nav class="navbar navbar-expand navbar-light flex-grow-1">
            <div class="container-fluid">
              <button
                id="mainSidebarToggleBtn"
                class="navbar-toggler d-lg-none me-2"
                type="button"
                aria-controls="navbarSupportedContent"
                aria-expanded="false"
                aria-label="Toggle navigation"
              >
                <span class="navbar-toggler-icon"></span>
              </button>

              <a class="navbar-brand py-0 me-auto" id="Brand" href="index.html">
                <img
                  id="logoWebsite"
                  src="img/TypingCore.svg"
                  alt="Logo Website"
                  style="height: 60px"
                />
              </a>
              <div
                class="navbar-collapse justify-content-between"
                id="navbarSupportedContent"
              >
                <ul class="navbar-nav align-items-center">
                  <li class="nav-item">
                    <a class="nav-link" href="index.html"
                      ><i class="fas fa-keyboard"></i
                    ></a>
                  </li>
                  <li class="nav-item">
                    <a class="nav-link active" href="lessons.html"
                      ><i class="fas fa-graduation-cap"></i
                    ></a>
                  </li>
                  <li class="nav-item">
                    <a class="nav-link" href="add-text.html"
                      ><i class="fas fa-plus-circle"></i
                    ></a>
                  </li>
                  <li class="nav-item">
                    <a class="nav-link" href="score-history.html"
                      ><i class="fas fa-history"></i
                    ></a>
                  </li>
                  <li class="nav-item">
                    <a class="nav-link" href="score-history.html"
                      ><i class="fas fa-bars"></i
                    ></a>
                  </li>
                </ul>
              </div>
              <div
                class="navbar-collapse justify-content-end"
                id="navbarSupportedContent2"
              >
                <ul class="navbar-nav align-items-center">
                  <!-- Pemilih tema: menggantikan toggle dark/light mode lama.
                       id="darkModeToggle" DIPERTAHANKAN (bukan diganti nama)
                       supaya referensi DOM.darkModeToggle di js/dom-elements.js
                       / js/main.js tidak putus - elemen ini sekarang berfungsi
                       sebagai trigger dropdown Bootstrap yang membuka grid
                       pilihan tema (dirender oleh js/theme.js ke dalam
                       #themePickerContainer, lihat renderThemePicker()). -->
                  <li class="nav-item dropdown">
                    <button
                      id="darkModeToggle"
                      type="button"
                      class="nav-link dropdown-toggle theme-picker-toggle"
                      data-bs-toggle="dropdown"
                      aria-expanded="false"
                      aria-label="Pilih Tema"
                      title="Pilih Tema"
                    >
                      <i class="fas fa-palette"></i>
                      <span class="theme-picker-current-name">Tema</span>
                    </button>
                    <div
                      class="dropdown-menu dropdown-menu-end theme-picker-dropdown-menu"
                      aria-labelledby="darkModeToggle"
                    >
                      <!-- Grid pilihan tema dirender di sini secara dinamis
                           oleh renderThemePicker() (js/theme.js), berdasarkan
                           data/themes.json. -->
                      <div id="themePickerContainer"></div>
                    </div>
                  </li>
                  <li class="nav-item dropdown">
                    <a
                      class="nav-link dropdown-toggle"
                      href="#"
                      id="navbarDropdownLang"
                      role="button"
                      data-bs-toggle="dropdown"
                      aria-expanded="false"
                    >
                      <i class="fas fa-globe"></i> Bahasa
                    </a>
                    <ul
                      class="dropdown-menu dropdown-menu-end"
                      aria-labelledby="navbarDropdownLang"
                    >
                      <li>
                        <a class="dropdown-item" href="#">Bahasa Indonesia</a>

                      <li><a class="dropdown-item" href="#">English</a></li>

        </header>
        <div id="MenuButton" class="d-flex align-items-center gap-2 justify-content-center my-3 mode-toolbar">
          <!-- Tombol mode "Quotes": TOGGLE (bukan salah satu dari beberapa
               pilihan) untuk mengaktifkan/menonaktifkan teks latihan berupa
               quote sungguhan (dengan nama sumber/author), bukan kata acak.
               Ditaruh paling kiri, dipisah garis pembatas dari tombol mode
               waktu supaya jelas ini kategori mode yang berbeda. Class
               "time-mode-btn" dipertahankan HANYA supaya tampilannya tetap
               konsisten dengan tombol mode waktu (styling di
               time-mode-modal.css) - class ini TIDAK lagi dipakai sebagai
               selector logika pemilihan durasi (lihat "time-mode-option-btn"
               di dalam modal di bawah). -->
          <button
            id="quoteModeBtn"
            type="button"
            class="btn btn-outline-primary time-mode-btn quote-mode-btn"
            aria-pressed="false"
            title="Latihan mengetik kutipan (quote) sungguhan"
          >
            Quotes
          </button>

          <span class="mode-toolbar-divider" aria-hidden="true"></span>

          <!-- Tombol mode waktu: satu tombol ikon jam yang menampilkan durasi
               terpilih saat ini. Klik membuka modal kecil (#timeModeModal)
               berisi pilihan preset 30/60/120/180 detik + input custom. -->
          <button
            id="timeModeToggleBtn"
            type="button"
            class="btn btn-outline-primary time-mode-btn time-mode-toggle-btn"
            aria-haspopup="dialog"
            aria-expanded="false"
            title="Pilih durasi tes"
          >
            <i class="fas fa-clock"></i>
            <span id="timeModeToggleValue">60s</span>
          </button>

          <span class="mode-toolbar-divider" aria-hidden="true"></span>

          <!-- Tombol Settings: sekarang memakai class "time-mode-btn" yang
               sama dengan tombol Quotes & tombol durasi (lihat
               time-mode-modal.css) supaya tinggi, border, dan warnanya
               konsisten dengan tombol lain di toolbar - sebelumnya memakai
               class Bootstrap polos ("btn btn-outline-dark") yang membuatnya
               terlihat "lepas"/tidak sejajar dari kelompok tombol lain. -->
          <a
            id="settingsButton"
            href="settings.html"
            class="btn btn-outline-primary time-mode-btn settings-mode-btn"
            aria-label="Pengaturan"
          >
            <i class="fas fa-cog"></i>
          </a>
        </div>

        <!-- Modal kecil pilihan durasi tes: muncul saat #timeModeToggleBtn
             diklik. Berisi 4 preset (30/60/120/180 detik) dan satu input
             custom (hanya angka) untuk durasi bebas dalam detik. -->
        <div id="timeModeModalOverlay" class="time-mode-modal-overlay" hidden>
          <div
            id="timeModeModal"
            class="time-mode-modal"
            role="dialog"
            aria-modal="true"
            aria-labelledby="timeModeModalTitle"
            tabindex="-1"
          >
            <div class="time-mode-modal-header">
              <span id="timeModeModalTitle">Pilih Durasi Tes</span>
              <button
                id="timeModeModalClose"
                type="button"
                class="time-mode-modal-close"
                aria-label="Tutup"
              >
                <i class="fas fa-times"></i>
              </button>
            </div>
            <div class="time-mode-modal-options">
              <button type="button" class="btn btn-outline-primary time-mode-btn time-mode-option-btn" data-time="30">30</button>
              <button type="button" class="btn btn-outline-primary time-mode-btn time-mode-option-btn" data-time="60">60</button>
              <button type="button" class="btn btn-outline-primary time-mode-btn time-mode-option-btn" data-time="120">120</button>
              <button type="button" class="btn btn-outline-primary time-mode-btn time-mode-option-btn" data-time="180">180</button>
            </div>
            <div class="time-mode-modal-custom">
              <label for="timeModeCustomInput">Custom (detik)</label>
              <div class="time-mode-modal-custom-row">
                <input
                  type="text"
                  inputmode="numeric"
                  pattern="[0-9]*"
                  id="timeModeCustomInput"
                  class="time-mode-custom-input"
                  placeholder="mis. 45"
                  maxlength="5"
                  autocomplete="off"
                />
                <button
                  id="timeModeCustomApply"
                  type="button"
                  class="btn btn-primary time-mode-custom-apply"
                >
                  Set
                </button>
              </div>
            </div>
          </div>
        </div>
        <section id="typing-test" class="page active">
          <div class="main-typing-area">
            <div class="typing-area-left-side">
              <div class="text-display-container">
                <div id="textDisplay" class="text-display"></div>
                <!-- Rumah baru untuk .smooth-caret: sibling #textDisplay,
                     TIDAK overflow-hidden/mask, supaya glow caret (mode
                     laser/lightsaber dkk.) tidak pernah terpotong atau
                     memudar di tepi atas text display. Lihat
                     text-display.js (getCaretOverlay) & text-display.css
                     (.caret-overlay). -->
                <div id="caretOverlay" class="caret-overlay"></div>
              </div>
              <!-- Nama sumber/author quote yang sedang aktif diketik saat mode
                   Quotes menyala. Disembunyikan (display:none) selama mode
                   Quotes tidak aktif; diisi & disinkronkan otomatis oleh
                   updateQuoteAuthorDisplay() di game-logic.js. -->
              <div id="quoteAuthorDisplay" class="quote-author-display" style="display: none;"></div>
              <div
                class="results-container"
                id="resultsDisplayArea"
                style="display: none"
              >
                <!-- XP Bar Container - Positioned at top right -->
                <div class="xp-bar-container">
                  <!-- Mini WPM & Akurasi - Positioned above XP indicator -->
                  <div class="mini-result-stats" id="miniResultStats">
                    <span class="mini-stat"><span id="finalWPM">--</span> wpm</span>
                    <span class="mini-stat"><span id="finalAccuracy">--%</span> acc</span>
                  </div>
                  <div class="xp-bar-text" id="xpBarText">+0 XP</div>
                  <div class="xp-bar-wrapper">
                    <div class="xp-bar-progress" id="xpBarProgress"></div>
                  </div>
                </div>
                <div class="chart-container">
                  <canvas id="resultChart"></canvas>
                </div>
                <div class="results-summary">
                  <div class="summary-details">
                    <div class="details-item">
                      <span class="details-label">RAW WPM</span>
                      <span id="finalRawWPM">--</span>
                    </div>
                    <div class="details-item">
                      <span class="details-label">Waktu Test</span>
                      <span id="finalTime">--s</span>
                    </div>
                    <div class="details-item">
                      <span class="details-label">Karakter</span>
                      <span id="finalChars">-- / -- / --</span>
                    </div>
                    <div class="details-item">
                      <span class="details-label">Konsistensi</span>
                      <span id="finalConsistency">--%</span>
                    </div>
                  </div>
                </div>
              </div>
              <div class="d-flex justify-content-center">
                <textarea
                  id="hiddenTextInput"
                  class="hidden-text-input"
                  autocomplete="off"
                  autocorrect="off"
                  autocapitalize="off"
                  spellcheck="false"
                  wrap="off"
                ></textarea>
                <button
                  id="restartButton"
                  class="btn restart-btn d-flex align-items-center justify-content-center flex-shrink-0"
                  aria-label="Mulai Ulang"
                >
                  <i class="fas fa-redo-alt fa-lg"></i>
               </button>
               <button
                  id="statisticsButton"
                  class="btn restart-btn result-only-btn d-flex align-items-center justify-content-center flex-shrink-0"
                  aria-label="Tampilkan Statistik"
                >
                  <i class="fas fa-chart-bar fa-lg"></i>
               </button>
               <!-- Tombol Latih Kata yang Salah: icon-only, sejajar dengan tombol
                    Restart & Statistik. Ikon "spell-check" dipakai supaya beda dari
                    ikon lain & langsung mengasosiasikan tombol ini dengan "perbaiki/latih
                    kata yang salah ketik". Hanya muncul setelah halaman hasil tampil DAN
                    ada kata yang salah (lihat updatePracticeWrongWordsButton di
                    game-logic.js); disembunyikan lagi setiap kali tes direset.
                    Class "result-only-btn" (lihat style.css) memaksa tombol ini & tombol
                    statistik tetap disembunyikan (display:none !important) kecuali saat
                    class "show" ditambahkan lewat JS, supaya keduanya konsisten HANYA
                    muncul di halaman hasil. -->
               <button
                  id="practiceWrongWordsBtn"
                  class="btn restart-btn result-only-btn practice-wrong-words-btn d-flex align-items-center justify-content-center flex-shrink-0"
                  aria-label="Latih Kata yang Salah"
                  title="Latih Kata yang Salah"
                >
                  <i class="fas fa-spell-check fa-lg"></i>
                  <span id="practiceWrongWordsCount" class="practice-wrong-words-count"
                    >0</span
                  >
               </button>
               <!-- Tombol "Ulangi dengan Ghost Caret": sama persis dengan tombol
                    Latih Kata yang Salah di atas, hanya beda ikon & warna (lihat
                    .ghost-practice-btn di style.css). Muncul setelah tes selesai
                    (gameState.ghostData terisi dari sesi yang baru selesai), lihat
                    updateGhostPracticeButton di game-logic.js. -->
               <button
                  id="ghostPracticeBtn"
                  class="btn restart-btn result-only-btn ghost-practice-btn d-flex align-items-center justify-content-center flex-shrink-0"
                  aria-label="Ulangi dengan Ghost Caret"
                  title="Ulangi teks yang sama dengan bayangan caret dari sesi sebelumnya"
                >
                  <i class="fas fa-ghost fa-lg"></i>
               </button>
              </div>
              <!-- Statistics Panel: tepat setelah tombol Restart/Statistik, di bawah area grafik -->
              <div id="statisticsPanel" class="statistics-panel" style="display: none;">
                <!-- Panel content will be injected here by statistics-panel.js -->
              </div>
              <div id="stats-container">
                <div class="text-stats-container" style="display: none; gap: 30px; justify-content: center; align-items: center; width: 100%; font-family: inherit;">
                  <div class="text-stat-item">
                    <span style="font-size: 0.9rem; opacity: 0.7;">WPM</span>
                    <div id="wpmTextDisplay" style="font-size: 2.5rem; font-weight: bold;">0</div>
                  </div>
                  <div class="text-stat-item">
                    <span style="font-size: 0.9rem; opacity: 0.7;">AKURASI</span>
                    <div id="accuracyTextDisplay" style="font-size: 2.5rem; font-weight: bold;">0%</div>
                  </div>
                  <div class="text-stat-item">
                    <span style="font-size: 0.9rem; opacity: 0.7;">DETIK</span>
                    <div id="timerTextDisplay" style="font-size: 2.5rem; font-weight: bold;">60</div>
                  </div>
                </div>
                <div class="stat-item">
                  <div class="speedometer-container">
                    <div class="speedometer-gauge-face">
                      <div class="speedometer-ticks" id="wpmTicks"></div>
                      <div class="speedometer-needle" id="wpmNeedle"></div>
                      <div class="speedometer-center-pin"></div>
                      <div class="speed-display" id="wpmValue">0</div>
                      <div class="speed-unit">WPM</div>
                    </div>
                  </div>
                </div>

                <div class="stat-item">
                  <div class="speedometer-container">
                    <div class="speedometer-gauge-face">
                      <div class="speedometer-ticks" id="accuracyTicks"></div>
                      <div class="speedometer-needle" id="accuracyNeedle"></div>
                      <div class="speedometer-center-pin"></div>
                      <div class="speed-display" id="accuracyValue">0%</div>
                      <div class="speed-unit">AKURASI</div>
                    </div>
                  </div>
                </div>

                <div class="stat-item">
                  <div class="speedometer-container">
                    <div class="speedometer-gauge-face">
                      <div class="speedometer-ticks" id="timerTicks"></div>
                      <div class="speedometer-needle" id="timerNeedle"></div>
                      <div class="speedometer-center-pin"></div>
                      <div class="speed-display" id="timerValue">60</div>
                      <div class="speed-unit">DETIK</div>
                    </div>
                  </div>
                </div>
              </div>

              <!-- Keyboard Virtual Container -->
              <div id="virtual-keyboard-container" class="keyboard-container hidden">
                <!-- Keyboard akan dirender di sini oleh JavaScript -->
              </div>
            </div>
          </div>
        </section>
      </main>
    </div>
    <script src="js/history/score-manager.js" type="module"></script>
    <script src="js/history/result-chart.js" type="module"></script>
    <script src="js/bootstrap/bootstrap.bundle.min.js"></script>
    <script src="js/main.js" type="module"></script>
  </body>
</html>
